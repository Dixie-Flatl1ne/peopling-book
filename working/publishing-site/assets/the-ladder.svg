<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" role="img" aria-label="The ladder: self, pair, group, machine">
  <style>
    text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .ink { fill: #22201d; }
    .muted { fill: #6f685e; }
    .accent { fill: #9e4d35; }
    .cool { fill: #3f6b6b; }
    .panel { fill: #efe8da; }
    .soft { fill: #e6d5cb; }
    .softc { fill: #d6e2e0; }
    .s-ink { stroke: #22201d; fill: none; }
    .s-muted { stroke: #6f685e; fill: none; }
    .s-line { stroke: #d8d0c3; fill: none; }
    .s-accent { stroke: #9e4d35; fill: none; }
    .s-cool { stroke: #3f6b6b; fill: none; }
    .m-ink { fill: #22201d; }
    .m-accent { fill: #9e4d35; }
    .m-cool { fill: #3f6b6b; }
    .m-muted { fill: #6f685e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eee9df; } .muted { fill: #aaa196; } .accent { fill: #d18165; } .cool { fill: #7fb3ad; }
      .panel { fill: #26231f; } .soft { fill: #3d2c25; } .softc { fill: #26332f; }
      .s-ink { stroke: #eee9df; } .s-muted { stroke: #aaa196; } .s-line { stroke: #3d3832; }
      .s-accent { stroke: #d18165; } .s-cool { stroke: #7fb3ad; }
      .m-ink { fill: #eee9df; } .m-accent { fill: #d18165; } .m-cool { fill: #7fb3ad; } .m-muted { fill: #aaa196; }
    }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-ink"/></marker>
    <marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-accent"/></marker>
    <marker id="a-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-cool"/></marker>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker>
  </defs>
  <g class="s-line" stroke-width="2" stroke-dasharray="4 6">
    <line x1="95" y1="104" x2="95" y2="118"/>
    <line x1="95" y1="206" x2="95" y2="220"/>
    <line x1="95" y1="308" x2="95" y2="322"/>
  </g>

  <rect x="20" y="16" width="960" height="88" rx="6" class="panel"/>
  <circle cx="95" cy="60" r="26" class="s-ink" stroke-width="2.5"/>
  <circle cx="85" cy="52" r="7" class="accent"/>
  <circle cx="104" cy="55" r="4.5" class="muted"/>
  <circle cx="88" cy="71" r="4" class="muted"/>
  <circle cx="105" cy="69" r="5.5" class="muted"/>
  <text x="180" y="54" font-size="23" font-weight="700" class="ink">Rung one: the self</text>
  <text x="180" y="82" font-size="18" class="muted">One head, narrating a coherent “you” out of a committee it cannot see.</text>

  <rect x="20" y="118" width="960" height="88" rx="6" class="panel"/>
  <circle cx="78" cy="162" r="17" class="s-ink" stroke-width="2.5"/>
  <circle cx="112" cy="162" r="17" class="s-ink" stroke-width="2.5"/>
  <circle cx="74" cy="162" r="8" class="accent"/>
  <circle cx="116" cy="162" r="8" class="cool"/>
  <line x1="95" y1="138" x2="95" y2="186" class="s-muted" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="180" y="156" font-size="23" font-weight="700" class="ink">Rung two: the pair</text>
  <text x="180" y="184" font-size="18" class="muted">Two heads, each holding a model of the other, and of the other’s model of them.</text>

  <rect x="20" y="220" width="960" height="88" rx="6" class="panel"/>
  <path d="M95 251 L106 258 L106 271 L95 278 L84 271 L84 258 Z" class="soft" stroke="#9e4d35" stroke-width="2"/>
  <g class="cool">
    <circle cx="127" cy="264" r="7"/><circle cx="111" cy="292" r="7"/><circle cx="79" cy="292" r="7"/>
    <circle cx="63" cy="264" r="7"/><circle cx="79" cy="236" r="7"/><circle cx="111" cy="236" r="7"/>
  </g>
  <text x="180" y="258" font-size="23" font-weight="700" class="ink">Rung three: the group</text>
  <text x="180" y="286" font-size="18" class="muted">Many heads maintaining one shared picture, and calling the upkeep “work”.</text>

  <rect x="20" y="322" width="960" height="88" rx="6" class="panel"/>
  <g class="cool"><circle cx="70" cy="348" r="9"/><circle cx="95" cy="342" r="9"/><circle cx="120" cy="348" r="9"/></g>
  <g class="s-muted" stroke-width="1.5">
    <line x1="70" y1="348" x2="95" y2="368"/><line x1="95" y1="342" x2="95" y2="362"/><line x1="120" y1="348" x2="95" y2="368"/>
  </g>
  <rect x="82" y="362" width="26" height="26" rx="5" class="soft" stroke="#9e4d35" stroke-width="2"/>
  <circle cx="90" cy="375" r="2.6" class="accent"/><circle cx="100" cy="375" r="2.6" class="accent"/>
  <text x="180" y="360" font-size="23" font-weight="700" class="ink">Rung four: the machine</text>
  <text x="180" y="388" font-size="18" class="muted">A node that has read the whole culture and has not met a single person.</text>

</svg>
