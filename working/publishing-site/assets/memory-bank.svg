<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" role="img" aria-label="The layered shared-context memory bank an agent sits on">
  <style>
    text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .ink { fill: #22201d; }
    .muted { fill: #6f685e; }
    .accent { fill: #9e4d35; }
    .cool { fill: #3f6b6b; }
    .panel { fill: #efe8da; }
    .soft { fill: #e6d5cb; }
    .softc { fill: #d6e2e0; }
    .s-ink { stroke: #22201d; fill: none; }
    .s-muted { stroke: #6f685e; fill: none; }
    .s-line { stroke: #d8d0c3; fill: none; }
    .s-accent { stroke: #9e4d35; fill: none; }
    .s-cool { stroke: #3f6b6b; fill: none; }
    .m-ink { fill: #22201d; }
    .m-accent { fill: #9e4d35; }
    .m-cool { fill: #3f6b6b; }
    .m-muted { fill: #6f685e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eee9df; } .muted { fill: #aaa196; } .accent { fill: #d18165; } .cool { fill: #7fb3ad; }
      .panel { fill: #26231f; } .soft { fill: #3d2c25; } .softc { fill: #26332f; }
      .s-ink { stroke: #eee9df; } .s-muted { stroke: #aaa196; } .s-line { stroke: #3d3832; }
      .s-accent { stroke: #d18165; } .s-cool { stroke: #7fb3ad; }
      .m-ink { fill: #eee9df; } .m-accent { fill: #d18165; } .m-cool { fill: #7fb3ad; } .m-muted { fill: #aaa196; }
    }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-ink"/></marker>
    <marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-accent"/></marker>
    <marker id="a-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-cool"/></marker>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker>
  </defs>
  <rect x="200" y="46" width="340" height="62" rx="31" class="soft" stroke="#9e4d35" stroke-width="2.5"/>
  <text x="370" y="76" font-size="20" font-weight="700" text-anchor="middle" class="accent">THE AGENT</text>
  <text x="370" y="97" font-size="15" text-anchor="middle" class="muted">a context-free genius, finally given context</text>
  <line x1="370" y1="132" x2="370" y2="114" class="s-accent" stroke-width="2.5" marker-end="url(#a-accent)"/>

  <path d="M44 452 L44 126" class="s-accent" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-accent)"/>
  <text transform="translate(30,330) rotate(-90)" font-size="15" text-anchor="middle" class="accent">distilled upward</text>

  <rect x="60" y="132" width="620" height="72" rx="8" class="panel" stroke="#6f685e" stroke-width="2"/>
  <text x="84" y="162" font-size="19" font-weight="700" class="ink">SEARCH</text>
  <text x="84" y="186" font-size="16" class="muted">so that anything can be found</text>
  <text x="700" y="162" font-size="15" class="cool">retrieval treated as retrieval,</text>
  <text x="700" y="182" font-size="15" class="cool">never as authority</text>

  <rect x="60" y="216" width="620" height="72" rx="8" class="panel" stroke="#6f685e" stroke-width="2"/>
  <text x="84" y="246" font-size="19" font-weight="700" class="ink">A READABLE KNOWLEDGE MODEL</text>
  <text x="84" y="270" font-size="16" class="muted">a page for each person, project and idea</text>
  <text x="700" y="246" font-size="15" class="cool">ordinary markdown a human</text>
  <text x="700" y="266" font-size="15" class="cool">can open and correct</text>

  <rect x="60" y="300" width="620" height="72" rx="8" class="panel" stroke="#6f685e" stroke-width="2"/>
  <text x="84" y="330" font-size="19" font-weight="700" class="ink">VALIDATED FACTS</text>
  <text x="84" y="354" font-size="16" class="muted">promoted only after they survive checking</text>
  <text x="700" y="324" font-size="15" class="cool">~27,500 candidates extracted,</text>
  <text x="700" y="344" font-size="15" class="cool">~13,000 accepted; the rest</text>
  <text x="700" y="364" font-size="15" class="cool">superseded, rejected or stale</text>

  <rect x="60" y="384" width="620" height="72" rx="8" class="panel" stroke="#6f685e" stroke-width="2"/>
  <text x="84" y="414" font-size="19" font-weight="700" class="ink">THE RAW RECORD</text>
  <text x="84" y="438" font-size="16" class="muted">every message, kept as evidence</text>
  <text x="700" y="414" font-size="15" class="cool">every belief traces back to the</text>
  <text x="700" y="434" font-size="15" class="cool">thing somebody actually said</text>

</svg>
