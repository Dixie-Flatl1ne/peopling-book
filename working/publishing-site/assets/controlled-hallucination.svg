<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" role="img" aria-label="Perception as prediction lightly corrected by the senses">
  <style>
    text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .ink { fill: #22201d; }
    .muted { fill: #6f685e; }
    .accent { fill: #9e4d35; }
    .cool { fill: #3f6b6b; }
    .panel { fill: #efe8da; }
    .soft { fill: #e6d5cb; }
    .softc { fill: #d6e2e0; }
    .s-ink { stroke: #22201d; fill: none; }
    .s-muted { stroke: #6f685e; fill: none; }
    .s-line { stroke: #d8d0c3; fill: none; }
    .s-accent { stroke: #9e4d35; fill: none; }
    .s-cool { stroke: #3f6b6b; fill: none; }
    .m-ink { fill: #22201d; }
    .m-accent { fill: #9e4d35; }
    .m-cool { fill: #3f6b6b; }
    .m-muted { fill: #6f685e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eee9df; } .muted { fill: #aaa196; } .accent { fill: #d18165; } .cool { fill: #7fb3ad; }
      .panel { fill: #26231f; } .soft { fill: #3d2c25; } .softc { fill: #26332f; }
      .s-ink { stroke: #eee9df; } .s-muted { stroke: #aaa196; } .s-line { stroke: #3d3832; }
      .s-accent { stroke: #d18165; } .s-cool { stroke: #7fb3ad; }
      .m-ink { fill: #eee9df; } .m-accent { fill: #d18165; } .m-cool { fill: #7fb3ad; } .m-muted { fill: #aaa196; }
    }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-ink"/></marker>
    <marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-accent"/></marker>
    <marker id="a-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-cool"/></marker>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker>
  </defs>
  <rect x="50" y="60" width="290" height="140" rx="8" class="panel" stroke="#6f685e" stroke-width="2"/>
  <text x="195" y="106" font-size="21" font-weight="700" text-anchor="middle" class="ink">PREDICTION ENGINE</text>
  <text x="195" y="136" font-size="17" text-anchor="middle" class="muted">a running model of what should</text>
  <text x="195" y="158" font-size="17" text-anchor="middle" class="muted">be out there, built from memory</text>
  <text x="195" y="180" font-size="17" text-anchor="middle" class="muted">and expectation</text>

  <path d="M344 114 L444 114 L444 98 L478 130 L444 162 L444 146 L344 146 Z" class="soft" stroke="#9e4d35" stroke-width="2"/>
  <text x="411" y="86" font-size="17" text-anchor="middle" class="accent">the guess — most of it</text>

  <circle cx="522" cy="130" r="48" class="softc" stroke="#3f6b6b" stroke-width="2"/>
  <text x="522" y="137" font-size="19" text-anchor="middle" class="ink">compare</text>

  <path d="M574 114 L672 114 L672 98 L706 130 L672 162 L672 146 L574 146 Z" class="soft" stroke="#9e4d35" stroke-width="2"/>
  <text x="634" y="86" font-size="17" text-anchor="middle" class="accent">lightly corrected</text>

  <rect x="712" y="60" width="238" height="140" rx="8" class="panel" stroke="#6f685e" stroke-width="2"/>
  <text x="831" y="112" font-size="20" font-weight="700" text-anchor="middle" class="ink">WHAT YOU</text>
  <text x="831" y="138" font-size="20" font-weight="700" text-anchor="middle" class="ink">EXPERIENCE</text>
  <text x="831" y="168" font-size="17" text-anchor="middle" class="muted">“the room”</text>

  <rect x="397" y="312" width="250" height="72" rx="8" class="panel" stroke="#3f6b6b" stroke-width="2"/>
  <text x="522" y="342" font-size="19" font-weight="700" text-anchor="middle" class="ink">YOUR SENSES</text>
  <text x="522" y="366" font-size="16" text-anchor="middle" class="muted">a thin trickle of data</text>
  <line x1="522" y1="312" x2="522" y2="184" class="s-cool" stroke-width="3" marker-end="url(#a-cool)"/>
  <text x="540" y="252" font-size="17" class="cool">supplies the occasional edit</text>

  <path d="M488 166 C 442 240 280 248 199 206" class="s-accent" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-accent)"/>
  <text x="330" y="288" font-size="17" text-anchor="middle" class="accent">prediction error — corrected only where the two disagree</text>

</svg>
