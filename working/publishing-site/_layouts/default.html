<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="book">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{{ page.title | default: site.title }} · Stefan van der Wel</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <button class="toc-toggle" id="toc-toggle" type="button" aria-controls="contents" aria-expanded="false">Contents</button>
  <aside class="sidebar" id="contents" aria-label="Book contents">
    <a class="book-mark" href="#top" aria-label="Return to the beginning">P</a>
    <p class="sidebar-title">Peopling</p>
    <nav id="toc"></nav>
    <p class="byline">Stefan van der Wel</p>
  </aside>
  <main id="top">
    <article class="book">
      {{ content }}
    </article>
    <footer>
      <p><strong>Peopling</strong><br>How Minds Stay in Sync, and Why Everything Depends on It</p>
      <p>Stefan van der Wel</p>
    </footer>
  </main>
  <script>
    (() => {
      const article = document.querySelector('.book');
      const toc = document.getElementById('toc');
      const headings = [...article.querySelectorAll('h1, h2')]
        .filter((heading, index) => index > 0 && heading.textContent.trim() !== 'Table of Contents');
      const slugCounts = new Map();
      headings.forEach((heading) => {
        let slug = heading.id || heading.textContent.toLowerCase()
          .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const count = slugCounts.get(slug) || 0;
        slugCounts.set(slug, count + 1);
        if (count) slug += `-${count + 1}`;
        heading.id = slug;
        if (heading.tagName === 'H1') {
          const link = document.createElement('a');
          link.href = `#${slug}`;
          link.textContent = heading.textContent;
          toc.appendChild(link);
        }
      });

      const sidebar = document.getElementById('contents');
      const toggle = document.getElementById('toc-toggle');
      toggle.addEventListener('click', () => {
        const open = sidebar.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
      });
      toc.addEventListener('click', () => {
        sidebar.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });

      const bar = document.getElementById('progress-bar');
      const updateProgress = () => {
        const max = document.documentElement.scrollHeight - innerHeight;
        bar.style.width = `${max > 0 ? (scrollY / max) * 100 : 0}%`;
      };
      addEventListener('scroll', updateProgress, { passive: true });
      updateProgress();
    })();
  </script>
</body>
</html>
