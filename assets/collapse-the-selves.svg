<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="From many audience selves to one self with a solid core">
  <style>
    text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .ink { fill: #22201d; }
    .muted { fill: #6f685e; }
    .accent { fill: #9e4d35; }
    .cool { fill: #3f6b6b; }
    .panel { fill: #efe8da; }
    .soft { fill: #e6d5cb; }
    .softc { fill: #d6e2e0; }
    .s-ink { stroke: #22201d; fill: none; }
    .s-muted { stroke: #6f685e; fill: none; }
    .s-line { stroke: #d8d0c3; fill: none; }
    .s-accent { stroke: #9e4d35; fill: none; }
    .s-cool { stroke: #3f6b6b; fill: none; }
    .m-ink { fill: #22201d; }
    .m-accent { fill: #9e4d35; }
    .m-cool { fill: #3f6b6b; }
    .m-muted { fill: #6f685e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eee9df; } .muted { fill: #aaa196; } .accent { fill: #d18165; } .cool { fill: #7fb3ad; }
      .panel { fill: #26231f; } .soft { fill: #3d2c25; } .softc { fill: #26332f; }
      .s-ink { stroke: #eee9df; } .s-muted { stroke: #aaa196; } .s-line { stroke: #3d3832; }
      .s-accent { stroke: #d18165; } .s-cool { stroke: #7fb3ad; }
      .m-ink { fill: #eee9df; } .m-accent { fill: #d18165; } .m-cool { fill: #7fb3ad; } .m-muted { fill: #aaa196; }
    }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-ink"/></marker>
    <marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-accent"/></marker>
    <marker id="a-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-cool"/></marker>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker>
  </defs>
  <rect x="24" y="64" width="452" height="356" rx="8" class="panel" opacity="0.55"/>
  <rect x="524" y="64" width="452" height="356" rx="8" class="panel" opacity="0.55"/>

  <text x="250" y="44" font-size="19" font-weight="700" text-anchor="middle" class="ink">AUDIENCE SELVES, EACH WITH A BILL</text>
  <text x="750" y="44" font-size="19" font-weight="700" text-anchor="middle" class="ink">ONE SELF, WITH A CORE</text>

  <g class="cool"><circle cx="66" cy="110" r="14"/><circle cx="66" cy="160" r="14"/><circle cx="66" cy="210" r="14"/><circle cx="66" cy="260" r="14"/><circle cx="66" cy="310" r="14"/></g>
  <text x="96" y="116" font-size="16" class="ink">for the senior stakeholder</text>
  <text x="96" y="166" font-size="16" class="ink">for the lads</text>
  <text x="96" y="216" font-size="16" class="ink">for the client</text>
  <text x="96" y="266" font-size="16" class="ink">for the board</text>
  <text x="96" y="316" font-size="16" class="ink">for whoever you want to like you</text>
  <g class="accent" opacity="0.75">
    <rect x="360" y="103" width="108" height="12" rx="3"/>
    <rect x="360" y="153" width="66" height="12" rx="3"/>
    <rect x="360" y="203" width="92" height="12" rx="3"/>
    <rect x="360" y="253" width="116" height="12" rx="3"/>
    <rect x="360" y="303" width="80" height="12" rx="3"/>
  </g>
  <text x="360" y="88" font-size="15" class="muted">upkeep</text>
  <line x1="46" y1="344" x2="454" y2="344" class="s-line" stroke-width="2"/>
  <text x="46" y="372" font-size="16" class="muted">plus a live model of how each one is landing:</text>
  <text x="46" y="394" font-size="16" class="accent">a guess about a guess, and it appears on nobody’s calendar</text>

  <line x1="486" y1="240" x2="516" y2="240" class="s-accent" stroke-width="4" marker-end="url(#a-accent)"/>

  <circle cx="750" cy="235" r="112" class="soft" opacity="0.35" stroke="#d8d0c3" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="750" cy="235" r="78" class="s-muted" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="750" cy="235" r="46" class="soft" stroke="#9e4d35" stroke-width="3"/>
  <text x="750" y="230" font-size="17" font-weight="700" text-anchor="middle" class="accent">CORE</text>
  <text x="750" y="252" font-size="15" text-anchor="middle" class="muted">conviction</text>
  <text x="750" y="392" font-size="16" text-anchor="middle" class="muted">loose surface — drawn up by whoever is nearby</text>

  <g class="cool"><circle cx="596" cy="300" r="16"/><circle cx="904" cy="300" r="16"/><circle cx="890" cy="150" r="16"/></g>
  <g class="s-cool" stroke-width="2" stroke-dasharray="5 5">
    <line x1="614" y1="292" x2="666" y2="270" marker-end="url(#a-cool)"/>
    <line x1="886" y1="292" x2="834" y2="270" marker-end="url(#a-cool)"/>
    <line x1="874" y1="160" x2="826" y2="186" marker-end="url(#a-cool)"/>
  </g>
  <text x="596" y="338" font-size="16" text-anchor="middle" class="cool">a crisis</text>
  <text x="904" y="338" font-size="16" text-anchor="middle" class="cool">a grieving friend</text>
  <text x="890" y="120" font-size="16" text-anchor="middle" class="cool">a junior to teach</text>

</svg>
